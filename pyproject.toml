[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-signal-lab"
version = "0.1.0"
description = "Streamlit extrema-training workbench with retained dashboard compatibility/export tooling for NQ/ES futures"
requires-python = ">=3.13"
license = {text = "Proprietary"}

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "tzdata>=2025.2",
    "polygon-api-client>=1.14.0",
    "databento>=0.40",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "streamlit>=1.38",
    "plotly>=5.18",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "protobuf>=6.31,<7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.5",
    "strategy-core @ git+https://github.com/thealgochef/Strategy-Core.git@c615e40ec13ef5a34d69910a78d144c677b138a8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pandas-stubs>=2.1",
    "aiosqlite>=0.20",
    "httpx>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "scipy.*"]
ignore_missing_imports = true
