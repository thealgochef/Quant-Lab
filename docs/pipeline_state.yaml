training_modes:
  extrema_rebound_crossing:
    status: "ACTIVE_RESEARCH"
    description: "Binary tick-level extrema classifier"
    target: "rebound vs crossing at detected price extrema"
    features: "PL microstructure + MS momentum; signal features supported lower-level"
    labels: "binary (0=crossing, 1=rebound)"
    runtime_detector: "ml_extrema_classifier.py (EXPERIMENTAL; train/serve mismatch)"

  dashboard_utility:
    status: "ACTIVE_STRATEGY_CORE_V3_RESEARCH_PATH"
    description: "3-class level-touch classifier built through Strategy-Core v3"
    target: "tradeable_reversal vs trap_reversal vs aggressive_blowthrough"
    engine_version: "strategy_core_engine_v3"
    contract_version: "trade_lab_contract_v1"
    bar_price_source: "trade_price"
    tick_size: 0.25
    default_bar_type: "147t"
    sessions:
      timezone: "US/Eastern"
      trading_day_boundary: "18:00"
      asia: "19:00-02:45"
      london: "03:00-08:00"
      ny: "09:00-17:00"
    level_scheme:
      pdh_pdl_source: "prior_day_full"
      session_levels:
        - "asia_high"
        - "asia_low"
        - "london_high"
        - "london_low"
        - "pdh"
        - "pdl"
      available_from_guard: true
    touch_rule: "bar_intersect merged zones; first_touch_per_zone_per_day"
    features:
      interaction:
        - "int_time_beyond_level"
        - "int_time_within_2pts"
        - "int_absorption_ratio"
      runtime_approach_subset:
        - "app_large_trade_vol_pct"
        - "app_avg_trade_size"
        - "app_max_spread"
    labels:
      classes:
        0: "tradeable_reversal"
        1: "trap_reversal"
        2: "aggressive_blowthrough"
      resolution: "mae_first"
      entry_reference: "realistic_at_decision"
      decision_offset_minutes: 5
      default_tp_points: 15.0
      default_sl_points: 30.0
      trap_mfe_min: 5.0
      flatten_time_et: "16:40"
      forward_cutoff_et: "17:00"
    inference_gate:
      eligible_class: "tradeable_reversal"
      eligible_session: "ny"
      confidence_gate: 0.70
    session_experiment_defaults:
      training_sessions: ["asia", "london", "ny"]
      evaluation_sessions: ["asia", "london", "ny"]
      production_gate_sessions: ["ny"]
      report_session_breakdowns: true
      presets:
        - "all_to_ny"
        - "ny_only"
        - "asia_only"
        - "london_only"
        - "asia_london_only"
        - "all_sessions_all_gates"
    runtime_consumer_status: "Trade-Lab not v3-compatible yet"

