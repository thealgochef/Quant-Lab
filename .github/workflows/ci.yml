name: ci

# Cold-install CI: pays the 9.6 NAMED DEBT (QL cold-install resolution check, the
# analog of Trade-Lab's backend-ci.yml). Catches dependency/portability regressions
# the editable/PYTHONPATH dev runs mask — e.g. a git+ssh strategy-core pin (no SSH
# key on a fresh runner), a stale pin missing a symbol QL imports, or an undeclared
# test dependency. Runs on pushes to main and on PRs.
# The ordinary install retains the stable Core pin. The optional IFSM research
# engine has its own exact-source preparation and test job below.
on:
  push:
    # platform-refactor included so the 9.6-enforcing run fires on this branch's
    # pushes rather than waiting for merge day; PRs still gate main only.
    branches: [main, platform-refactor]
  pull_request:
    branches: [main]
  # W2 P4b (A157): manual runs for greenlight witnessing without a push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quant-lab:
    name: quant-lab (cold install + ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reject tracked local artifacts
        run: python scripts/check_tracked_artifacts.py

      # Clean install from scratch. Resolves the strategy-core dependency from its
      # git+https pin against the public Strategy-Core repo (anonymous, no key or
      # token) and installs all runtime + dev dependencies — the pin goes from
      # DECLARED to ENFORCED here (decision 9.6).
      - name: Install (cold)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Test (pytest)
        run: pytest -q

  ifsm-research:
    name: IFSM research (exact optional Core + focused contracts)
    runs-on: ubuntu-latest
    env:
      IFSM_REQUIRE_RESEARCH_CORE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set external research paths for subsequent steps
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          core = Path(os.environ["RUNNER_TEMP"]) / "ifsm-research-core"
          paths = os.pathsep.join(map(str, (root / "src", root / "scripts", core / "src")))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"IFSM_RESEARCH_CORE={core}\nPYTHONPATH={paths}\n")
          PY
      - name: Install ordinary dependencies
        run: pip install -e ".[dev]"
      - name: Prepare exact research Core outside the repository
        run: python scripts/prepare_ifsm_research_core.py --destination "$IFSM_RESEARCH_CORE"
      - name: Verify the actual launcher and all research choices
        run: python scripts/run_ifsm_research_ui.py --check
      - name: Test exact Core clock and invalidation boundaries
        run: >-
          python -m pytest -q
          "$IFSM_RESEARCH_CORE/tests/test_ifvg_daily_close.py"
          "$IFSM_RESEARCH_CORE/tests/test_ifvg_gap_invalidation.py"
          "$IFSM_RESEARCH_CORE/tests/test_ifvg_pending_delivery.py"
      - name: Test research authoring and execution evidence
        run: >-
          python -m pytest -q
          tests/agents/test_ifsm_research_runtime.py
          tests/agents/test_ifvg_gap_invalidation_ui.py
          tests/agents/test_ifvg_daily_close_sessions_ui.py
          tests/agents/test_ifvg_daily_close_evidence.py
          tests/agents/test_ifvg_gap_validity_evidence.py
          tests/agents/test_ifvg_scheduled_exit_accounting.py
